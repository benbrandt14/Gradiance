[target.x86_64-unknown-linux-gnu]
# lld cuts link time substantially on a Bevy-sized binary (the dominant cost
# of an incremental rebuild). Needs `lld` installed (`apt install lld`; CI
# installs it). If your machine lacks lld, comment out `rustflags` to fall
# back to the default linker.
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
