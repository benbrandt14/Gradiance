[package]
name = "gradiance"
version = "0.2.0"
edition = "2024"
description = "An Algodoo-inspired 2.5D physics sandbox"
license = "MIT OR Apache-2.0"

[dependencies]
# Engine + physics. Versions are exact-pinned: agent sessions must not drift APIs.
bevy = "=0.19.0"
# `serialize` lets authored avian components go straight into the RON save
# (the de-adapter collapse — see docs/physics-deadapter-decision.md). Save
# stability across avian versions is explicitly not a goal.
avian2d = { version = "=0.7.0", features = ["serialize"] }
bevy_egui = "=0.41.0"
# In-editor script console: a code editor widget with lisp syntax highlighting
# and completion (shares egui 0.35 with bevy_egui). UI-only, `src/ui/` only.
egui_code_editor = "=0.3.7"
leafwing-input-manager = "=0.21.0"

# Geometry
lyon = "1.0"
clipper2 = "0.6"
glam = { version = "0.32", features = ["serde"] }

# Identity + persistence
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rfd = "0.17"

# Utilities
thiserror = "2"
rand = "0.9"
mimalloc = "0.1"

# Scripting (Tier-A authoring engine): the Lisp control plane is a first-class
# part of the tool, compiled into every build. The two-tier PERF rule still
# holds — the steel VM runs only on the authoring (cold) path, never in the
# per-frame loop (continuous drivers lower to `src/script/kernel.rs`); see
# docs/script-lisp-decision.md. Confined to `src/script/` (tests/boundaries.rs).
steel-core = "=0.8.2"

[features]
# Dev-only inner loop: `cargo run --features dev`.
# - dynamic_linking: links Bevy as a dylib, cutting incremental link time.
# - file_watcher: asset hot-reload (and the hook for future .scm hot-reload).
# Never enable for release/CI builds; the default build stays fully static.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

[dev-dependencies]
proptest = "1.9"
rstest = "0.26"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
# Agentic hardening: no silent panics in product code (tests are exempted via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Keep signal high without fighting Bevy idioms.
pedantic = { level = "warn", priority = -1 }
type_complexity = "allow"             # Bevy Query types are inherently "complex"
needless_pass_by_value = "allow"      # Bevy systems take Res/Query by value
too_many_arguments = "allow"          # Bevy systems are parameter lists by design
many_single_char_names = "allow"      # p, a, b, u, v ARE the math vocabulary
struct_excessive_bools = "allow"      # editor configs are independent toggles
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"         # f32 world; u32->f32 casts are routine
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "warn"

# Enable a small amount of optimization in debug mode for our code,
# and full optimization for dependencies (Bevy/physics are unusable at opt 0).
[profile.dev]
opt-level = 1
# Full debuginfo makes linking several Bevy-sized test binaries exceed
# container memory; line tables keep backtraces useful at a fraction of it.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
