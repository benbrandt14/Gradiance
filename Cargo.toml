[package]
name = "gradiance"
version = "0.1.0"
edition = "2021"

[dependencies]
avian2d = "0.2"
bevy_egui = "0.33"

[dependencies.bevy]
version = "0.15"
default-features = false
features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_window",
    "bevy_gizmos",
    "bevy_state",
    "x11",
    "wayland",
    "png",
    "file_watcher",
    "multi_threaded"
]

[dev-dependencies]
rstest = "0.23"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
