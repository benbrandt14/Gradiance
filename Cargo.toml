[package]
name = "gradiance"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15.3"
bevy_rapier2d = { version = "0.28.0", features = ["simd-stable", "debug-render-2d"] }
nalgebra = "0.33.0"
# salva2d = "0.9.0" # Incompatible
# bevy_mod_picking = { version = "0.20.0", features = ["backend_rapier"] } # Incompatible
bevy_egui = "0.31"
# bevy_mod_scripting = "0.8.0" # Unused
# bevy_hanabi = "0.14.0" # Version conflict
# bevy_smud = "0.11.0" # Version conflict
bevy_mod_outline = "0.9.0"
bevy_prototype_lyon = "0.13.0"
bevy_polyline = "0.11.0"
bevy_vello = "0.7.1"
vello = "0.7.0"
bevy_transform_gizmo = "0.12.1"
bevy_tween = "0.7.0"
clipper2 = "0.5.3"

[package.metadata.rdme]
# Configuration for cargo-rdme
heading_base_level = 1

[dev-dependencies]
bevy_mod_debugdump = "0.12"
rstest = "0.21.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 1
