[package]
name = "gradiance"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.4.1"
bevy_egui = ">0.17.0"
bevy_firefly = "*"

[dependencies.bevy]
version = "0.17.1"
default-features = false
features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_window",
    "bevy_gizmos",
    "bevy_state",
    "x11",
    "png",
    "file_watcher",
    "multi_threaded",
    "dynamic_linking",
]

[dev-dependencies]
rstest = "*"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
