[package]
name = "gradiance"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = { version = "0.5.0", default-features = false, features = [
    "2d",
    "f64",
    "parry-f64",
    "simd",
    "xpbd_joints",
    "bevy_scene",
    "bevy_picking",
    "bevy_diagnostic",
    "diagnostic_ui",
    "debug-plugin",
    "serialize",
    "validate",
] }
bevy = "0.18.0"
bevy_console = "0.16.0"
bevy_egui = "0.39.0"
bevy_firefly = "0.18.0"
bevy_hanabi = "0.17.0"
bevy_mod_outline = "0.10.3"
bevy_mod_scripting = "0.17.0"
bevy_picking = "0.18.0"
bevy_polyline = "0.13.0"
bevy_prototype_lyon = "0.16.0"
bevy_smud = "0.12.0"
bevy_transform_gizmo = "0.12.1"
bevy_tween = "0.11.0"
bevy_ui = "0.18.0"
bevy_vello = "0.12.1"
clipper2 = "0.5.3"
moonshine-save = "0.6.0"
rstest = "0.26.1"
vello = "0.7.0"

[package.metadata.rdme]
# Configuration for cargo-rdme
heading_base_level = 1

[dev-dependencies]
bevy_mod_debugdump = "0.15"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
