[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Engine + physics. Versions are exact-pinned: agent sessions must not drift
# APIs (enforced by tests/boundaries.rs).
bevy = "=0.19.0"
# `serialize` lets authored avian components go straight into the RON save
# (the de-adapter collapse — see docs/physics-deadapter-decision.md). Save
# stability across avian versions is explicitly not a goal.
avian2d = { version = "=0.7.0", features = ["serialize"] }
bevy_egui = "=0.41.0"
# Node-graph editor widget: the Simulink-style signal canvas. Shares egui 0.35
# with bevy_egui (the only major node-editor crate on egui 0.35).
egui-snarl = "=0.11.0"
# Docking/tabbing workspace (Rerun's tiling lib; the desktop-app shell — see
# docs/ui-shell-decision.md). Shares egui 0.35 with bevy_egui.
egui_tiles = "=0.16.0"
leafwing-input-manager = "=0.21.0"

# Geometry
lyon = "1.0"
# Features-only dependency: turns on the serde impls for the bevy math types
# (Vec2) that authored data serializes. Never imported directly.
glam = { version = "0.32", features = ["serde"] }

# Identity + persistence
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rfd = "0.17"

# Utilities
thiserror = "2"
mimalloc = "0.1"

# Scripting (Tier-A authoring engine): the Lisp control plane is a first-class
# part of the tool, compiled into every build. The two-tier PERF rule still
# holds — the steel VM runs only on the authoring (cold) path, never in the
# per-frame loop (continuous drivers lower to `gradiance-kernel`); see
# docs/script-lisp-decision.md. Confined to `crates/gradiance-script`.
steel-core = "=0.8.2"
colorgrad = { version = "0.8.0", features = ["preset"] }

# Test-only
proptest = "1.9"
# UI layout tests for panel leaf renderers (shares egui 0.35 with bevy_egui).
# Accessibility-tree queries only — no GPU, no screenshot farm.
egui_kittest = "=0.35.0"

# Workspace members
gradiance-core = { path = "crates/gradiance-core" }
gradiance-kernel = { path = "crates/gradiance-kernel" }
gradiance-units = { path = "crates/gradiance-units" }
gradiance-geometry = { path = "crates/gradiance-geometry" }
gradiance-domain = { path = "crates/gradiance-domain" }
gradiance-scene = { path = "crates/gradiance-scene" }
gradiance-physics = { path = "crates/gradiance-physics" }
gradiance-signal = { path = "crates/gradiance-signal" }
gradiance-command = { path = "crates/gradiance-command" }
gradiance-persist = { path = "crates/gradiance-persist" }
gradiance-interaction = { path = "crates/gradiance-interaction" }
gradiance-render = { path = "crates/gradiance-render" }
gradiance-script = { path = "crates/gradiance-script" }
gradiance-ui = { path = "crates/gradiance-ui" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
# Agentic hardening: no silent panics in product code (tests are exempted via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Keep signal high without fighting Bevy idioms.
pedantic = { level = "warn", priority = -1 }
type_complexity = "allow"             # Bevy Query types are inherently "complex"
needless_pass_by_value = "allow"      # Bevy systems take Res/Query by value
too_many_arguments = "allow"          # Bevy systems are parameter lists by design
many_single_char_names = "allow"      # p, a, b, u, v ARE the math vocabulary
struct_excessive_bools = "allow"      # editor configs are independent toggles
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"         # f32 world; u32->f32 casts are routine
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "warn"

[package]
name = "gradiance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An Algodoo-inspired 2.5D physics sandbox"

[lints]
workspace = true

[dependencies]
gradiance-core.workspace = true
gradiance-kernel.workspace = true
gradiance-units.workspace = true
gradiance-geometry.workspace = true
gradiance-domain.workspace = true
gradiance-scene.workspace = true
gradiance-physics.workspace = true
gradiance-signal.workspace = true
gradiance-command.workspace = true
gradiance-persist.workspace = true
gradiance-interaction.workspace = true
gradiance-render.workspace = true
gradiance-script.workspace = true
gradiance-ui.workspace = true
bevy.workspace = true
mimalloc.workspace = true

[features]
# Dev-only inner loop: `cargo run --features dev`.
# - dynamic_linking: links Bevy as a dylib, cutting incremental link time.
# - file_watcher: asset hot-reload (and the hook for future .scm hot-reload).
# - gradiance-command/dev: the per-frame Changed<> sync-count trace.
# Never enable for release/CI builds; the default build stays fully static.
dev = [
    "bevy/dynamic_linking",
    "bevy/file_watcher",
    "gradiance-command/dev",
]

[dev-dependencies]
avian2d.workspace = true
# The integration suite drives the whole app, egui panels included.
bevy_egui.workspace = true
proptest.workspace = true
egui_kittest.workspace = true
uuid.workspace = true

# Enable a small amount of optimization in debug mode for our code,
# and full optimization for dependencies (Bevy/physics are unusable at opt 0).
[profile.dev]
opt-level = 1
# Full debuginfo makes linking several Bevy-sized test binaries exceed
# container memory; line tables keep backtraces useful at a fraction of it.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Coverage runs (the CI `coverage` job; locally only via `cargo llvm-cov
# --profile coverage` on a machine with room for instrumented artifacts):
# dev-shaped, but dependencies at opt 0 — coverage accuracy does not depend
# on dependency codegen, and the instrumented graph stays CI-sized.
[profile.coverage]
inherits = "dev"

[profile.coverage.package."*"]
opt-level = 0
