[package]
name = "gradiance"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15.3"
bevy_rapier2d = { version = "0.28.0", features = ["simd-stable", "debug-render-2d"] }
nalgebra = "0.33.0"
# salva2d = "0.9.0" # Incompatible
bevy_egui = "0.31"
bevy_prototype_lyon = "0.13.0"
proptest = "1.9.0"
mimalloc = "0.1"
anyhow = "1.0"

[package.metadata.rdme]
# Configuration for cargo-rdme
heading_base_level = 1

[dev-dependencies]
bevy_mod_debugdump = "0.12"
rstest = "0.21.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 1
