[package]
name = "gradiance-command"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gradiance command layer: intents, undoable commands, the mutation choke point"

[lints]
workspace = true

[dependencies]
gradiance-core.workspace = true
gradiance-domain.workspace = true
# Physical continuity at a command boundary: the cut tool carries a severed
# body's velocity onto its pieces, through the sanctioned read cut-point.
gradiance-physics.workspace = true
gradiance-units.workspace = true
gradiance-geometry.workspace = true
gradiance-scene.workspace = true
gradiance-signal.workspace = true
bevy.workspace = true
thiserror.workspace = true

[features]
# Dev-only observability: traces the per-frame `Changed<>` sync-match counts
# (the deferred pipeline's cause→symptom gap). Intents and commands trace from
# `dispatch` unconditionally, so the default build keeps that structured trace.
dev = []
