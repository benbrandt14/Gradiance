name: CI

on:
  push:
    branches: [main]
  pull_request:

# One live run per ref: an agent pushing fixups shouldn't queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The CI toolchain. See the comment on the `ci` job's toolchain step.
  RUST_PIN: "1.97.0"

# Lint policy: clippy::pedantic runs at *warn* (Cargo.toml), and `-D warnings`
# below promotes every warning — pedantic included — to an error. That is
# only stable because the toolchain is pinned (`RUST_PIN`): new lints arrive
# in a deliberate toolchain-bump PR, never as a surprise on main.
#
# All cargo invocations run `--locked`: agent sessions must not drift the
# resolved graph silently — a lockfile change is a reviewed diff, not a
# side effect.
#
# Architecture/coupling enforcement lives in `tests/boundaries.rs` (crate
# DAG, egui/steel confinement, serde confinement, exact pins) — it runs in
# the main job. The `coupling` job is an informational report, not a gate.
#
# Unused-dependency sweep: `cargo udeps` is deliberately NOT run — it needs a
# nightly toolchain plus a full extra build of a Bevy-sized graph per run,
# for a dependency list that is exact-pinned and reviewed by hand (the
# boundaries test asserts the pins). `-D warnings` already denies dead_code.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev clang lld

      # Pinned, like Cargo.lock: `pedantic` is warn-level and clippy runs
      # with `-D warnings`, so on `@stable` every Rust release that adds a
      # pedantic lint turned main red with no code change (2026-10). A
      # toolchain bump is now a reviewed PR that fixes the new lints in the
      # same diff. Keep `RUST_PIN` in sync across jobs; agent containers run
      # this version, so local gates reproduce CI exactly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        id: rust-cache

      - name: Report cache hit
        # Surfaces cache behavior in the job log; a miss on an unchanged
        # Cargo.lock means the cache key rotated and build times will spike.
        run: |
          echo "rust-cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::rust-cache miss — cold build (expected only after a Cargo.lock or toolchain change)"
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Short-format diagnostics are teed to a file so the step below can
        # re-emit them as annotations: agent sessions cannot download Actions
        # logs (403), but they can read annotations through the REST API
        # (`gh api repos/{o}/{r}/check-runs/{id}/annotations`). Same gate,
        # same exit code — only the reporting changes.
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --message-format=short --color=never -- -D warnings 2>&1 | tee clippy.txt

      - name: Annotate clippy failures
        # GitHub keeps at most 10 error annotations per step, so the most
        # useful lines go first: located diagnostics, then a tail fallback
        # for failures that are not lints (build scripts, ICEs).
        if: failure()
        shell: bash
        run: |
          set +e
          sed -E 's/\x1b\[[0-9;]*m//g' clippy.txt > clippy.plain
          hits=$(grep -E '(^|: )(error|warning)(\[[^]]*\])?:' clippy.plain | grep -v 'could not compile\|aborting due to' | head -9)
          if [ -n "$hits" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$hits"
          fi
          echo "::error::tail: $(tail -n 12 clippy.plain | tr '\n' '|' | cut -c1-1500)"
          exit 0

      - name: Architecture boundaries (crate DAG, confinement, pins)
        run: cargo test --locked --test boundaries

      - name: Dependency duplicates (informational)
        # Holds the pinned-dep line: the boundaries test fails on unpinned
        # engine deps; this log shows any accidental duplicate-major drift
        # in the resolved graph for review.
        run: cargo tree --locked --duplicates --depth 1 -e normal || true

      - name: Docs (no broken links)
        run: cargo doc --locked --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked --workspace

  coverage:
    # Instrumented builds are too heavy for agent containers (see
    # docs/workspace-plan.md § coverage baseline) — CI owns coverage.
    # cargo-llvm-cov (not tarpaulin: tarpaulin force-appends -Cdebuginfo=2
    # to the whole graph, which does not fit constrained disks) over the
    # `coverage` profile (deps at opt 0 — instrumentation accuracy does not
    # depend on dependency codegen).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev clang lld

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          # Coverage artifacts (instrument-coverage RUSTFLAGS) never match
          # the main job's; keep them in their own cache line.
          shared-key: coverage

      - name: Coverage (floor 50% lines)
        # The floor has headroom under the current 55.3% so it flags real
        # regressions (a milestone landing large untested logic), not noise.
        # UI/render draw paths are headless-blind and hold the total down —
        # raise the floor as windowed testing lands, never chase 100%.
        run: cargo llvm-cov --locked --workspace --profile coverage --fail-under-lines 50 --lcov --output-path lcov.info
        env:
          # cargo-llvm-cov appends to RUSTFLAGS; restate lld because the env
          # var overrides .cargo/config.toml's target rustflags.
          RUSTFLAGS: -C link-arg=-fuse-ld=lld

      - name: Coverage summary
        # `report` reuses the profdata from the run above — it must name the
        # same profile, or it searches the wrong target subdirectory.
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --profile coverage --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  coupling:
    # Informational only (continue-on-error): module-level coupling drift is
    # a review signal, not a gate — the *crate*-level DAG is the enforced
    # boundary (tests/boundaries.rs::the_crate_dag_matches_the_architecture).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-coupling

      - name: Coupling report
        run: |
          echo '## cargo-coupling report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo coupling --ai --exclude-tests --no-git | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
