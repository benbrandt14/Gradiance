name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs if you push new code quickly
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /home/brandtb/Developments/RustRunner_Gitlab/.persistent-cargo-target
  SCCACHE_DIR: /home/brandtb/.cache/sccache
  RUSTC_WRAPPER: /home/brandtb/.cargo/bin/sccache

jobs:
  test:
    name: Test & Lint
    # matches the label you added during setup
    runs-on: self-hosted 
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      # Since this is a persistent machine, we run standard cargo commands.
      # No need to install toolchains or dependencies if they are on your host.

      - name: Run Tests
        run: cargo test

      # - name: Check Formatting
      #   run: cargo fmt --all -- --check

      # - name: Clippy
      #   run: cargo clippy --all-targets --all-features -- -D warnings

