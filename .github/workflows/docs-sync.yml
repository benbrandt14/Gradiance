name: Docs & Architecture Sync
on: [push]
  branches: [main]

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      # 1. Enforce Docstrings (Fails if missing)
      - name: Check Documentation Coverage
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

      # 3. Sync Rust Docs to README
      - name: Sync README
        run: cargo rdme --force

      # 4. Commit Artifacts (Only if changed)
      - name: Commit Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update architecture graph and readme"
          file_pattern: "doc/*.png README.md"