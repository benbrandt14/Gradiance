name: Release

on:
  release:
    types: [created]
  # Allows you to run this manually from the Actions tab for testing
  workflow_dispatch: 

env:
  # CHANGE THIS to your actual binary name in Cargo.toml
  binary: bevy_template 

jobs:
  release-linux:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Build Release
        # We use standard build. No cross-compilation needed on native linux.
        run: cargo build --release

      - name: Prepare Package
        run: |
          mkdir -p linux_dist
          # Copy the binary from target/release (no cryptic target triple folders needed on native)
          cp target/release/${{ env.binary }} linux_dist/
          cp -r assets linux_dist/

      - name: Zip Package
        working-directory: ./linux_dist
        run: zip --recurse-paths ../${{ env.binary }}-linux.zip .

      # Uploads the zip to the Action Summary page (good for testing)
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: ${{ env.binary }}-linux.zip

      # Only runs if this was triggered by a real Release, not a manual test
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}-linux.zip
          asset_name: ${{ env.binary }}-linux.zip
          tag: ${{ github.ref }}
          overwrite: true