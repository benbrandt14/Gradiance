name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  binary: gradiance

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: ""
          - os: windows-latest
            target: windows
            ext: ".exe"
          - os: macos-latest
            target: macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # The binary is self-contained (shaders are embedded assets), so a
      # release is exactly one file per platform.
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ env.binary }}${{ matrix.ext }}" dist/
          cd dist
          if [ "${{ matrix.target }}" = "windows" ]; then
            7z a "../${{ env.binary }}-${{ matrix.target }}.zip" .
          else
            tar czf "../${{ env.binary }}-${{ matrix.target }}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.binary }}-${{ matrix.target }}
          path: ${{ env.binary }}-${{ matrix.target }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.binary }}-${{ matrix.target }}.*
