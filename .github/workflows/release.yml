name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  binary: gradiance

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: ""
          - os: windows-latest
            target: windows
            ext: ".exe"
          - os: macos-latest
            target: macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev clang lld libeigen3-dev

      # `gradiance-slvs-sys` compiles the vendored SolveSpace solver with `cc`
      # and hand-written bindings, so no libclang and no bindgen are involved on
      # any platform. Eigen is the one thing it needs from the system — it is
      # header-only, and vendoring it would add ~150k lines. See
      # third_party/solvespace/SOURCE.md.
      - name: Install Eigen (macOS)
        if: matrix.target == 'macos'
        run: brew install eigen

      - name: Install Eigen (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          vcpkg install eigen3:x64-windows
          echo "EIGEN3_INCLUDE_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # The binary is self-contained (shaders are embedded assets), so a
      # release is exactly one file per platform.
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ env.binary }}${{ matrix.ext }}" dist/
          cd dist
          if [ "${{ matrix.target }}" = "windows" ]; then
            7z a "../${{ env.binary }}-${{ matrix.target }}.zip" .
          else
            tar czf "../${{ env.binary }}-${{ matrix.target }}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.binary }}-${{ matrix.target }}
          path: ${{ env.binary }}-${{ matrix.target }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.binary }}-${{ matrix.target }}.*
