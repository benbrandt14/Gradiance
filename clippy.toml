allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# Product and project names that `clippy::doc_markdown` mistakes for code
# identifiers. Backticking them would wrongly imply they name a type or
# function. `..` keeps clippy's own default list.
doc-valid-idents = ["SolveSpace", "SolveSpace's", "OpenGL", ".."]
